deptrac:
  paths:
    - ./app
  layers:
    - name: Core
      collectors:
        - type: directory
          value: app/Core
    - name: Modules
      collectors:
        - type: directory
          value: app/Modules
    - name: Shared
      collectors:
        - type: directory
          value: app/Shared
  ruleset:
    Core:
      - Shared
    Modules:
      - Core
      - Shared
    Shared: ~
